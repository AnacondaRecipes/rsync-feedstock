{% set name = "rsync" %}
{% set version = "3.5.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://www.samba.org/ftp/{{ name }}/src/{{ name }}-{{ version }}.tar.gz
    sha256: a10d591825251e070f74c98df3daad195def4ed81b4a2de16169026aea33f6c8

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - perl *
    - gnuconfig  # [unix]
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}  # [osx and arm64]
    - make
  host:
    - libiconv {{ libiconv }}
    - libidn2 {{ libidn2 }}
    - lz4-c {{ lz4_c }}
    - openssl {{ openssl }}
    - popt {{ popt }}
    - xxhash {{ xxhash }}
    - zlib {{ zlib }}
    - zstd {{ zstd }}
  run:
    # all bounds through run_exports.
    - libiconv
    - lz4-c
    - openssl
    - popt
    - xxhash
    - zlib
    - zstd

test:
  commands:
    - rsync --help
    - rsync --version

about:
  home: https://rsync.samba.org/
  license: GPL-3.0-only
  license_family: GPL
  license_file: COPYING
  summary: Tool for fast incremental file transfer
  description: |
    rsync is an open source utility that provides fast incremental file transfer.
  doc_url: https://rsync.samba.org/documentation.html
  dev_url: https://git.samba.org/?p=rsync.git

extra:
  recipe-maintainers:
    - notestaff
    - sodre
    - xhochy
